booktitle:
  name: "0から作る自作DB入門"
subtitle: "課題駆動で学ぶDBの仕組み"
author: 佐佐木悠人
language: ja

# 章立て（catalog.yaml に PREDEF / CHAPS / POSTDEF を定義している）
